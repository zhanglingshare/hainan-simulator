name: Hainan Industry Research Quality Gate
on:
  push:
    branches: [main]
    paths:
      - 'industry/**'
      - '.github/workflows/industry-research.yml'
  pull_request:
    paths:
      - 'industry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scientific model syntax and UI
        run: |
          node --check industry/model.js
          node --check industry/app.js
      - name: Scientific contracts and reproducibility tests
        run: node --test industry/tests/*.test.cjs
      - name: Install headless Chromium for independent UI acceptance
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile interaction smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hainan-http.log 2>&1 &
          node industry/tests/browser-smoke.cjs
      - name: Verify no overwritten source pages
        run: |
          test -f index.html
          test -f scenario.html
          test -f measurement.html
          test -f industry/index.html
